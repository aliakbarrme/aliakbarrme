<svg xmlns="http://www.w3.org/2000/svg" width="252" height="48" viewBox="0 0 252 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D3FB8"/><stop offset="1" stop-color="#2E9EF7"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="248" height="42" rx="21.0"/></clipPath>
<filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".22"/></filter>
<style>
.shine{animation:m 3.2s ease-in-out infinite}
@keyframes m{0%{transform:translateX(-80px) skewX(-20deg)}60%,100%{transform:translateX(312px) skewX(-20deg)}}
.arr{animation:a 1.6s ease-in-out infinite}
@keyframes a{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
</style></defs>
<g filter="url(#sh)"><rect x="2" y="2" width="248" height="42" rx="21.0" fill="url(#g)"/></g>
<g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="50" height="48" fill="url(#s)"/></g>
<rect x="2.5" y="2.5" width="247" height="41" rx="20.5" fill="none" stroke="#fff" stroke-opacity=".28"/>
<text x="28" y="27.5" font-size="17" text-anchor="middle">🤖</text>
<text x="48" y="26.5" font-size="15" font-weight="700" fill="#fff">AI FAQ Chatbot Lite</text>
<g class="arr"><text x="227" y="26.5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">↗</text></g>
</svg>