<svg xmlns="http://www.w3.org/2000/svg" width="380" height="84" viewBox="0 0 380 84" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#075E54"/><stop offset="1" stop-color="#25D366"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="376" height="80" rx="18"/></clipPath>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity=".25"/></filter>
<style>
.shine{animation:move 3.2s ease-in-out infinite}
@keyframes move{0%{transform:translateX(-160px) skewX(-20deg)}60%,100%{transform:translateX(460px) skewX(-20deg)}}
.pulse{animation:p 2.4s ease-in-out infinite;transform-origin:325.0px 42px}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
</style>
</defs>
<g filter="url(#sh)"><rect x="2" y="2" width="376" height="80" rx="18" fill="url(#g)"/></g>
<g clip-path="url(#c)"><rect class="shine" x="0" y="0" width="90" height="84" fill="url(#s)"/></g>
<rect x="2.5" y="2.5" width="375" height="79" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".25"/>
<circle cx="42" cy="42" r="23" fill="#fff" fill-opacity=".18"/>
<text x="42" y="50" font-size="22" text-anchor="middle">🟢</text>
<text x="78" y="38" font-size="18" font-weight="700" fill="#fff">WhatsApp Order</text>
<text x="78" y="58" font-size="12.5" fill="#fff" fill-opacity=".85">WooCommerce Plugin</text>
<g class="pulse"><rect x="282" y="28" width="86" height="28" rx="14" fill="#fff" fill-opacity=".95"/>
<text x="325.0" y="46.5" font-size="11" font-weight="800" fill="#075E54" text-anchor="middle" letter-spacing=".6">GITHUB ↗</text></g>
</svg>